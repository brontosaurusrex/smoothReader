<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' blob: data:; font-src 'self' blob: data: https://fonts.gstatic.com"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smooth Reader</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&amp;family=Crimson+Pro:ital,wght@0,400;0,700;1,400;1,700&amp;family=Literata:ital,wght@0,400;0,700;1,400;1,700&amp;family=Lora:ital,wght@0,400;0,700;1,400;1,700&amp;family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&amp;family=Source+Serif+4:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap"
    >
    <link rel="stylesheet" href="styles-v8.css">
  </head>
  <body>
    <main id="app">
      <button id="drop-zone" type="button" aria-label="Drop an EPUB here or choose a file">
        <span>DROP THE EBOOK</span>
        <small>EPUB</small>
      </button>

      <section id="reader" aria-label="Ebook reader" hidden>
        <div id="viewer"></div>
      </section>

      <div id="drag-cover" aria-hidden="true" hidden>
        <span>DROP THE EBOOK</span>
      </div>

      <div id="status" role="status" aria-live="polite" hidden></div>
      <input id="file-input" type="file" accept=".epub,application/epub+zip" hidden>
    </main>

    <script src="vendor/jszip.min.js"></script>
    <script src="vendor/jszip-global.js"></script>
    <script src="vendor/epub.min.js"></script>
    <script src="renderer-v8.js"></script>
  </body>
</html>
